name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version" || { echo "Could not read versionName from app/build.gradle.kts" >&2; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$version" >&2
            exit 1
          fi
          echo "app_version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KS_B64: ${{ secrets.LITE_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.LITE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LITE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LITE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$KS_B64" ]] || { echo "Required secret LITE_KEYSTORE_B64 is missing" >&2; exit 1; }
          [[ -n "$KS_PASSWORD" ]] || { echo "Required secret LITE_KEYSTORE_PASSWORD is missing" >&2; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { echo "Required secret LITE_KEY_ALIAS is missing" >&2; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo "Required secret LITE_KEY_PASSWORD is missing" >&2; exit 1; }
          key_path="$RUNNER_TEMP/litepptx-release.jks"
          printf '%s' "$KS_B64" | base64 --decode > "$key_path"
          keytool -list -keystore "$key_path" -storepass "$KS_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "LITE_KEYSTORE_PATH=$key_path"
            echo "LITE_KEYSTORE_PASSWORD=$KS_PASSWORD"
            echo "LITE_KEY_ALIAS=$KEY_ALIAS"
            echo "LITE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease --no-daemon --console=plain

      - name: Verify package, signature and checksum
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          "$build_tools/apksigner" verify --verbose "$apk"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -F "package: name='com.litepptx.viewer'" <<< "$badging"
          grep -F "versionName='$APP_VERSION'" <<< "$badging"
          cp "$apk" LitePPTXViewer.apk
          sha256sum LitePPTXViewer.apk > LitePPTXViewer.apk.sha256
          cat LitePPTXViewer.apk.sha256
          stat --printf='APK size: %s bytes\n' LitePPTXViewer.apk

      - name: Verify release signing certificate matches previous release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          previous_dir="$RUNNER_TEMP/previous-release"
          mkdir -p "$previous_dir"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern LitePPTXViewer.apk --dir "$previous_dir"
          previous_signer="$("$build_tools/apksigner" verify --print-certs "$previous_dir/LitePPTXViewer.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          release_signer="$("$build_tools/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [[ -n "$previous_signer" && "$release_signer" == "$previous_signer" ]] || {
            echo "Release APK signing certificate does not match the latest published release" >&2
            exit 1
          }
          echo "Signing certificate matches the latest published release."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LitePPTXViewer-APK
          path: |
            LitePPTXViewer.apk
            LitePPTXViewer.apk.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: LitePPTXViewer-APK
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="release-notes/${TAG}.md"
          test -s dist/LitePPTXViewer.apk
          test -s dist/LitePPTXViewer.apk.sha256
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" dist/LitePPTXViewer.apk dist/LitePPTXViewer.apk.sha256 \
              --title "LitePPTX ${TAG}" --notes-file "$NOTES" --verify-tag --latest
          else
            gh release create "$TAG" dist/LitePPTXViewer.apk dist/LitePPTXViewer.apk.sha256 \
              --title "LitePPTX ${TAG}" --generate-notes --verify-tag --latest
          fi
