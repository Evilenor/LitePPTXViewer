name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key (if configured)
        env:
          KS_B64: ${{ secrets.LITE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LITE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "LITE_KEYSTORE_PASSWORD=${{ secrets.LITE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "LITE_KEY_ALIAS=${{ secrets.LITE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "LITE_KEY_PASSWORD=${{ secrets.LITE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No release key configured - falling back to the debug key."
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Name the APK and checksum it
        run: |
          cp app/build/outputs/apk/release/app-release.apk LitePPTXViewer.apk
          sha256sum LitePPTXViewer.apk | tee LitePPTXViewer.apk.sha256
          ls -l LitePPTXViewer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LitePPTXViewer-APK
          path: |
            LitePPTXViewer.apk
            LitePPTXViewer.apk.sha256

      # Pushing a tag such as v1.3.0 publishes a GitHub Release. The in-app updater reads it.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" LitePPTXViewer.apk LitePPTXViewer.apk.sha256 \
              --title "LitePPTX ${TAG}" --notes-file "$NOTES" --verify-tag
          else
            gh release create "$TAG" LitePPTXViewer.apk LitePPTXViewer.apk.sha256 \
              --title "LitePPTX ${TAG}" --generate-notes --verify-tag
          fi
